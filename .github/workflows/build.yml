name: Build

# One plug-in for both platforms, built on the platforms themselves: a macOS
# binary has to come from a Mac and a Windows one from Windows. A third job
# merges the two into a single VST3 bundle, which is the only thing shipped.
on:
  push:
    branches: [main, claude/vst3-music-idea-generator-vqgacc]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  JUCE_TAG: 8.0.6

jobs:
  engine:
    name: Engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # The engine is JUCE-free and builds in seconds, so it is the fast
      # signal: if these fail, nothing about the plugin builds is worth waiting
      # for.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS build
    # macOS runners bill at 10x the wall clock and Windows at 2x, so a push that
    # builds both costs about eighty minutes of a two-thousand-minute month. A
    # day of ordinary commits exhausted the account's quota, and once it is gone
    # every job fails instantly with no runner, no logs and nothing to read - it
    # looks exactly like the code being broken. The engine tests still run on
    # every push, because they are Linux and cost what they say. The binaries are
    # built when a build is actually wanted: on a v* tag, or on demand from the
    # Actions tab.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git external/JUCE

      - name: Configure
        # Universal, so one download serves Intel and Apple Silicon. 10.15 is
        # the floor because the library walk uses std::filesystem.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHARMONIA_BUILD_PLUGIN=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the plugin is universal and sealed
        run: |
          BUNDLE="build/plugin/Progressions_artefacts/Release/VST3/Progressions.vst3"
          lipo -archs "$BUNDLE/Contents/MacOS/Progressions"
          lipo -archs "$BUNDLE/Contents/MacOS/Progressions" | grep -q arm64
          lipo -archs "$BUNDLE/Contents/MacOS/Progressions" | grep -q x86_64
          # A broken seal is refused by macOS and skipped by the host in
          # silence, so it has to fail here rather than on someone's machine.
          codesign -v --strict "$BUNDLE"

      # Handed to the merge job, not shipped on its own.
      - name: Keep the bundle
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            "build/plugin/Progressions_artefacts/Release/VST3/Progressions.vst3" \
            "dist/macos-bundle.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*

  windows:
    name: Windows build
    # macOS runners bill at 10x the wall clock and Windows at 2x, so a push that
    # builds both costs about eighty minutes of a two-thousand-minute month. A
    # day of ordinary commits exhausted the account's quota, and once it is gone
    # every job fails instantly with no runner, no logs and nothing to read - it
    # looks exactly like the code being broken. The engine tests still run on
    # every push, because they are Linux and cost what they say. The binaries are
    # built when a build is actually wanted: on a v* tag, or on demand from the
    # Actions tab.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE
        run: git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git external/JUCE

      - name: Configure
        run: cmake -S . -B build -A x64 -DHARMONIA_BUILD_PLUGIN=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check the plugin carries its own runtime
        shell: pwsh
        run: |
          $dll = "build\plugin\Progressions_artefacts\Release\VST3\Progressions.vst3\Contents\x86_64-win\Progressions.vst3"
          if (-not (Test-Path $dll)) { throw "No plugin at $dll" }
          # A dependency on the redistributable is invisible until someone
          # without it tries to load the plugin, so read the import table here.
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          foreach ($lib in 'VCRUNTIME140', 'MSVCP140') {
            if ($text -match $lib) { throw "$dll still imports $lib - the runtime is not static" }
          }
          Write-Host "No Visual C++ redistributable needed."

      # Only the DLL is needed downstream: the merge job drops it into the
      # macOS bundle, where it becomes the Windows half of one plug-in.
      - name: Keep the Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\plugin\Progressions_artefacts\Release\VST3\Progressions.vst3\Contents\x86_64-win\Progressions.vst3" `
                    "dist\Progressions.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*

  universal:
    name: One bundle for both
    needs: [macos, windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # On macOS because the signature has to be applied after the Windows binary
    # goes in - adding a file to a signed bundle breaks the seal, and a broken
    # seal is refused by macOS with nothing said anywhere.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: mac

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: win

      # The same script anyone can run on a Mac when CI cannot get a runner,
      # rather than a copy of it that only exists in this file.
      - name: Merge, sign, verify
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: packaging/merge.sh mac/macos-bundle.zip win/Progressions.vst3 dist

      - uses: actions/upload-artifact@v4
        with:
          name: universal-vst3
          path: dist/*

  release:
    name: Release
    needs: [engine, universal]
    # A manual run publishes too, not only a tag push. Pushing a tag needs
    # credentials that the container this is developed from does not have, and
    # without this the only way to a release was a download page that has to be
    # hunted for behind a login. The token inside Actions can create the tag, so
    # it does - from the version in CMakeLists.txt, which is the one the
    # plug-in and the instructions already carry.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: universal-vst3
          path: artifacts

      - name: Work out the tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
              version=$(sed -n 's/.*project(Harmonia VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
              [ -n "$version" ] || { echo "No version in CMakeLists.txt" >&2; exit 1; }
              echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      # One download: the plug-in and its instructions.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # The page has to answer "is this the current one?" on its own. A
          # version can be republished, so the file name alone cannot say - and
          # whoever is about to forward this to somebody should not have to ask.
          notes=$(cat <<NOTES
          Built from \`${GITHUB_SHA:0:7}\` on $(date -u '+%d %b %Y, %H:%M UTC').

          | file | |
          |---|---|
          | \`Progressions-${TAG#v}.zip\` | The plug-in and INSTALL.txt. **This is the one to share.** |
          | \`install-macos.command\` | Only if macOS gives trouble. Put it beside Progressions.vst3 and double-click it. |
          | \`install-windows.ps1\` | Only if Windows gives trouble. Put it beside Progressions.vst3 and right-click -> Run with PowerShell. |

          One plug-in, both systems: a .vst3 is a folder, and it carries a macOS and a Windows binary side by side.
          NOTES
          )
          # Re-running a build for a version already out replaces its files
          # rather than failing, so a fix can be shipped under the same name.
          if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" artifacts/* --clobber
              gh release edit "$TAG" --notes "$notes"
          else
              gh release create "$TAG" --target "$GITHUB_SHA" --notes "$notes" artifacts/*
          fi
